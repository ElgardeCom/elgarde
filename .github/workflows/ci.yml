name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  canon:
    name: inspection-core self-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Schemas, structure and conformance vectors
        run: python inspection-core/tools/check.py
      - name: Every package's copy of the canon is in sync
        run: python inspection-core/tools/sync_canon.py --check

  python:
    name: Python package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from the built package, not the source tree
        run: pip install ./packages/python pytest
      - name: Conformance vectors
        working-directory: packages/python
        run: python -m pytest -q

  js:
    name: npm package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Conformance vectors
        working-directory: packages/js
        run: node --test

  mcp:
    name: MCP server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Tools, transports and the stdio entry point
        working-directory: mcp
        run: node --test
      - name: The published bin actually starts
        run: |
          node mcp/bin/elgarde-mcp.js &
          pid=$!
          sleep 2
          kill -0 "$pid" || { echo "stdio server exited immediately"; exit 1; }
          kill "$pid"

  dart:
    name: Dart package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: packages/dart
        run: dart pub get
      - name: Format
        working-directory: packages/dart
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        working-directory: packages/dart
        run: dart analyze --fatal-infos
      - name: Conformance vectors
        working-directory: packages/dart
        run: dart test
      - name: Publish dry run
        working-directory: packages/dart
        run: dart pub publish --dry-run

  php:
    name: PHP package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mbstring
          coverage: none
      - name: composer.json is valid and publishable
        run: composer validate --strict
      - name: Conformance vectors
        run: php packages/php/tests/conformance.php

  openapi:
    name: OpenAPI snapshot is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Parse and sanity-check the committed spec
        run: |
          python - <<'PY'
          import json, sys
          spec = json.load(open("openapi/elgarde-api.json"))
          assert spec["openapi"].startswith("3.1"), spec["openapi"]
          paths = set(spec["paths"])
          expected = {"/v1/meta", "/v1/checklist", "/v1/defects", "/v1/score", "/v1/vin/{vin}"}
          assert paths == expected, f"unexpected paths: {paths ^ expected}"
          # The snapshot must never carry an authenticated route.
          for path in paths:
              assert path.startswith("/v1/"), path
          print(f"OK — {len(paths)} public paths, OpenAPI {spec['openapi']}")
          PY

  no-secrets:
    name: No secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan for credential-shaped strings
        run: |
          set +e
          hits=$(grep -rniE \
            'BEGIN [A-Z ]*PRIVATE KEY|(secret|api[_-]?key|password|passwd|access[_-]?token)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{8,}' \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules . )
          if [ -n "$hits" ]; then
            echo "Possible secret material:"; echo "$hits"; exit 1
          fi
          echo "Clean."
